[project]
name = "scamcheck"
version = "0.1.0"
description = "Scam message checker with a repeatable prompt/model evaluation"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8", "httpx>=0.27", "python-dotenv>=1", "pydantic>=2", "streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scamcheck = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
